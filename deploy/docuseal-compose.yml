services:
  app:
    image: docuseal/docuseal:3.3.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: "postgresql://docuseal:${DOCUSEAL_DATABASE_PASSWORD:?Set DOCUSEAL_DATABASE_PASSWORD}@postgres:5432/docuseal"
      SECRET_KEY_BASE: "${DOCUSEAL_SECRET_KEY_BASE:?Set DOCUSEAL_SECRET_KEY_BASE}"
      APP_URL: "https://shop-1.tail1d791.ts.net:8443"
    volumes:
      - docuseal_data:/data/docuseal
    networks:
      default: {}
      autoshop:
        aliases:
          - docuseal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: docuseal
      POSTGRES_USER: docuseal
      POSTGRES_PASSWORD: "${DOCUSEAL_DATABASE_PASSWORD:?Set DOCUSEAL_DATABASE_PASSWORD}"
    volumes:
      - docuseal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuseal -d docuseal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  docuseal_data:
  docuseal_postgres:

networks:
  autoshop:
    external: true
    name: autoshopsoftware_default
