version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: collision-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: collision_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
