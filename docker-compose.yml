version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: collision-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: collision_shop
      POSTGRES_USER: collision_shop_app
      POSTGRES_PASSWORD: collision_shop_app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collision_shop_app -d collision_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
