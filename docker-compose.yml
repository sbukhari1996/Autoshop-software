services:
  db:
    image: postgres:16-alpine
    container_name: collision-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: collision_shop
      POSTGRES_USER: collision_shop_app
      POSTGRES_PASSWORD: collision_shop_app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collision_shop_app -d collision_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: collision-shop-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://collision_shop_app:collision_shop_app@db:5432/collision_shop?schema=public
      PORT: 4000
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      NEON_AUTH_URL: ${NEON_AUTH_URL:-}
      NEON_AUTH_JWKS_URL: ${NEON_AUTH_JWKS_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@mastercraftautony.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Mastercraft2026!}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Mastercraft Admin}
      ENABLE_DEFAULT_ADMIN: ${ENABLE_DEFAULT_ADMIN:-true}
    ports:
      - "4000:4000"
    volumes:
      - api_uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_NEON_AUTH_URL: ${VITE_NEON_AUTH_URL:-}
    container_name: collision-shop-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
  api_uploads:
