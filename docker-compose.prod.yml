# Production overrides: no dev port publishing, Caddy handles TLS + routing.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  db:
    ports: []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collision_shop}
      POSTGRES_USER: ${POSTGRES_USER:-collision_shop_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}

  api:
    ports: []
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-collision_shop_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}@db:5432/${POSTGRES_DB:-collision_shop}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required in production}
      ENABLE_DEFAULT_ADMIN: ${ENABLE_DEFAULT_ADMIN:-false}
    restart: always

  frontend:
    build:
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required in production}
        VITE_NEON_AUTH_URL: ${VITE_NEON_AUTH_URL:-}
    ports: []
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: collision-shop-caddy
    restart: always
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
